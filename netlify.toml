[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/book"
  to = "/growth-check/"
  status = 301

[[redirects]]
  from = "/book/thanks"
  to = "/thanks/"
  status = 301

[[redirects]]
  from = "/services/operations-and-analytics"
  to = "/services/reporting-analytics/"
  status = 301

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
